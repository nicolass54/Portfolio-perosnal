<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="p4-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#p4-bg)" rx="16"/>
  <rect width="800" height="42" fill="#090d16" rx="16"/>
  <rect y="30" width="800" height="12" fill="#090d16"/>
  <circle cx="25" cy="21" r="6" fill="#ef4444"/>
  <circle cx="45" cy="21" r="6" fill="#eab308"/>
  <circle cx="65" cy="21" r="6" fill="#22c55e"/>
  <text x="95" y="26" fill="#38bdf8" font-family="monospace" font-size="13">api-gateway // telemetry-monitor.sh</text>

  <!-- Terminal Style Metrics -->
  <rect x="30" y="65" width="740" height="405" rx="8" fill="#030712" stroke="#1e293b"/>
  
  <text x="50" y="100" fill="#22c55e" font-family="monospace" font-size="13">user@gateway-node-01:~$ netstat --summary --throughput</text>
  <text x="50" y="125" fill="#38bdf8" font-family="monospace" font-size="12">STATUS: HEALTHY | UPTIME: 142d 18h | ACTIVE INSTANCES: 16/16</text>
  
  <!-- Server Topology Node Diagram -->
  <g transform="translate(60, 150)">
    <!-- Client -->
    <rect x="0" y="80" width="110" height="50" rx="8" fill="#1e293b" stroke="#38bdf8"/>
    <text x="20" y="110" fill="#f8fafc" font-family="monospace" font-size="12">Client Apps</text>
    
    <!-- Arrow -->
    <line x1="110" y1="105" x2="180" y2="105" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 2"/>
    
    <!-- Gateway -->
    <rect x="180" y="55" width="150" height="100" rx="8" fill="#1e1b4b" stroke="#a855f7" stroke-width="2"/>
    <text x="200" y="90" fill="#a855f7" font-family="monospace" font-size="13" font-weight="bold">API GATEWAY</text>
    <text x="200" y="110" fill="#94a3b8" font-family="monospace" font-size="10">Rate Limit: 10k req/s</text>
    <text x="200" y="128" fill="#22c55e" font-family="monospace" font-size="10">JWT Auth: Cached</text>

    <!-- Arrows out -->
    <line x1="330" y1="75" x2="420" y2="35" stroke="#a855f7" stroke-width="2"/>
    <line x1="330" y1="105" x2="420" y2="105" stroke="#a855f7" stroke-width="2"/>
    <line x1="330" y1="135" x2="420" y2="175" stroke="#a855f7" stroke-width="2"/>

    <!-- Microservices -->
    <rect x="420" y="15" width="140" height="40" rx="6" fill="#0f172a" stroke="#22c55e"/>
    <text x="435" y="40" fill="#4ade80" font-family="monospace" font-size="11">Auth Service (Go)</text>

    <rect x="420" y="85" width="140" height="40" rx="6" fill="#0f172a" stroke="#38bdf8"/>
    <text x="430" y="110" fill="#38bdf8" font-family="monospace" font-size="11">Billing API (Node)</text>

    <rect x="420" y="155" width="140" height="40" rx="6" fill="#0f172a" stroke="#f59e0b"/>
    <text x="430" y="180" fill="#f59e0b" font-family="monospace" font-size="11">Data Pipeline (Py)</text>
  </g>

  <!-- Live Stats Bar -->
  <rect x="50" y="380" width="700" height="65" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="70" y="410" fill="#94a3b8" font-family="monospace" font-size="12">P99 LATENCY: <tspan fill="#22c55e" font-weight="bold">18ms</tspan></text>
  <text x="250" y="410" fill="#94a3b8" font-family="monospace" font-size="12">THROUGHPUT: <tspan fill="#38bdf8" font-weight="bold">4.2M req/day</tspan></text>
  <text x="480" y="410" fill="#94a3b8" font-family="monospace" font-size="12">TEST COVERAGE: <tspan fill="#a855f7" font-weight="bold">98.2%</tspan></text>
  <text x="70" y="432" fill="#64748b" font-family="monospace" font-size="11">Stack: Node.js, Express, Redis, Docker Swarm, Prometheus, Grafana</text>
</svg>