<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="50%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="silver-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#737373"/>
    </linearGradient>
    <linearGradient id="hoodie" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262626"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e5e5e5"/>
      <stop offset="100%" stop-color="#a3a3a3"/>
    </linearGradient>
    <filter id="white-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Circle with White Ring -->
  <circle cx="250" cy="250" r="235" fill="url(#bg-grad)" stroke="#262626" stroke-width="4"/>
  <circle cx="250" cy="250" r="235" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="16 12" filter="url(#white-glow)" opacity="0.6"/>
  <circle cx="250" cy="250" r="215" fill="none" stroke="#525252" stroke-width="1.5" opacity="0.4"/>

  <!-- Tech Geometric Decor Grid in Grayscale -->
  <g opacity="0.15" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="50" x2="400" y2="50"/>
    <line x1="50" y1="120" x2="450" y2="120"/>
    <line x1="50" y1="380" x2="450" y2="380"/>
    <line x1="120" y1="50" x2="120" y2="450"/>
    <line x1="380" y1="50" x2="380" y2="450"/>
    <circle cx="250" cy="250" r="180" fill="none"/>
  </g>

  <!-- Developer Silhouette / Character -->
  <!-- Hoodie Body -->
  <path d="M120 460 C120 360 170 330 250 330 C330 330 380 360 380 460 Z" fill="url(#hoodie)" stroke="#404040" stroke-width="3"/>
  <path d="M225 330 L225 460 M275 330 L275 460" stroke="#737373" stroke-width="2" opacity="0.6"/>
  <!-- Hoodie Strings -->
  <path d="M210 340 Q205 390 215 410" stroke="#d4d4d4" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M290 340 Q295 390 285 410" stroke="#d4d4d4" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Neck -->
  <path d="M220 280 L220 335 L280 335 L280 280 Z" fill="#737373"/>

  <!-- Head Base -->
  <path d="M185 200 C185 130 315 130 315 200 C315 260 285 295 250 295 C215 295 185 260 185 200 Z" fill="url(#skin)"/>

  <!-- Hair Style -->
  <path d="M175 185 C170 110 240 90 295 105 C330 115 335 150 325 180 C315 145 285 130 250 130 C210 130 185 155 175 185 Z" fill="#000000"/>
  <path d="M220 95 C250 85 290 90 320 125 C290 110 250 110 220 95 Z" fill="#ffffff" opacity="0.3"/>

  <!-- Cyber Glasses in Monochrome -->
  <rect x="180" y="185" width="60" height="32" rx="6" fill="#0a0a0a" stroke="#ffffff" stroke-width="3" filter="url(#white-glow)"/>
  <rect x="260" y="185" width="60" height="32" rx="6" fill="#0a0a0a" stroke="#ffffff" stroke-width="3" filter="url(#white-glow)"/>
  <line x1="240" y1="200" x2="260" y2="200" stroke="#ffffff" stroke-width="3"/>
  <!-- Code Reflection in Glasses -->
  <text x="186" y="202" fill="#ffffff" font-family="monospace" font-size="9" font-weight="bold">&lt;dev/&gt;</text>
  <text x="186" y="212" fill="#a3a3a3" font-family="monospace" font-size="8">clean()</text>
  <text x="266" y="202" fill="#ffffff" font-family="monospace" font-size="9" font-weight="bold">const=1</text>
  <text x="266" y="212" fill="#a3a3a3" font-family="monospace" font-size="8">build()</text>

  <!-- Smile -->
  <path d="M235 255 Q250 265 265 255" stroke="#404040" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Cyber Headphones in Monochrome -->
  <path d="M165 190 Q160 110 250 100 Q340 110 335 190" fill="none" stroke="#525252" stroke-width="12" stroke-linecap="round"/>
  <rect x="160" y="180" width="22" height="48" rx="8" fill="#171717" stroke="#ffffff" stroke-width="2"/>
  <rect x="318" y="180" width="22" height="48" rx="8" fill="#171717" stroke="#ffffff" stroke-width="2"/>

  <!-- Code Floating Badges (B&W) -->
  <g transform="translate(60, 140)">
    <rect width="65" height="28" rx="6" fill="#171717" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <text x="10" y="18" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">TS / JS</text>
  </g>
  <g transform="translate(370, 150)">
    <rect width="70" height="28" rx="6" fill="#171717" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <text x="12" y="18" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">React</text>
  </g>
  <g transform="translate(360, 310)">
    <rect width="75" height="28" rx="6" fill="#171717" stroke="#a3a3a3" stroke-width="1.5" opacity="0.9"/>
    <text x="10" y="18" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">Node.js</text>
  </g>
  <g transform="translate(65, 300)">
    <rect width="70" height="28" rx="6" fill="#171717" stroke="#a3a3a3" stroke-width="1.5" opacity="0.9"/>
    <text x="10" y="18" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">Python</text>
  </g>

  <!-- Verified Coder Badge in Monochrome -->
  <g transform="translate(215, 420)">
    <rect width="70" height="22" rx="11" fill="#ffffff"/>
    <text x="14" y="15" fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold">ONLINE</text>
  </g>
</svg>