<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="p2-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e102e"/>
    </linearGradient>
    <linearGradient id="neon-cyan-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#p2-bg)" rx="16"/>
  <!-- Top Bar -->
  <rect width="800" height="42" fill="#181824" rx="16"/>
  <rect y="30" width="800" height="12" fill="#181824"/>
  <circle cx="25" cy="21" r="6" fill="#ef4444"/>
  <circle cx="45" cy="21" r="6" fill="#eab308"/>
  <circle cx="65" cy="21" r="6" fill="#22c55e"/>
  <text x="95" y="26" fill="#cbd5e1" font-family="monospace" font-size="13">https://novastore-3d.dev // Cyber Fashion UI</text>

  <!-- Navbar inside mockup -->
  <rect x="25" y="60" width="750" height="50" rx="8" fill="#131320" stroke="#2d2d44"/>
  <text x="45" y="91" fill="#ec4899" font-family="sans-serif" font-size="16" font-weight="900">NOVA<tspan fill="#06b6d4">3D</tspan></text>
  <text x="180" y="90" fill="#94a3b8" font-family="sans-serif" font-size="12">Products</text>
  <text x="260" y="90" fill="#94a3b8" font-family="sans-serif" font-size="12">Customizer</text>
  <text x="350" y="90" fill="#94a3b8" font-family="sans-serif" font-size="12">VR Showroom</text>
  <rect x="650" y="70" width="105" height="30" rx="15" fill="url(#neon-cyan-pink)"/>
  <text x="668" y="90" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Cart (3)</text>

  <!-- 3D Canvas Mockup -->
  <rect x="25" y="125" width="460" height="345" rx="12" fill="#121124" stroke="#3b1d54"/>
  <!-- 3D Grid floor -->
  <path d="M40 430 L255 240 L470 430 M100 430 L255 240 L410 430 M180 430 L255 240 L330 430" stroke="#a855f7" stroke-width="1" opacity="0.3"/>
  <!-- Hologram Sneaker / Product -->
  <ellipse cx="255" cy="310" rx="130" ry="25" fill="#a855f7" opacity="0.25"/>
  <path d="M160 300 Q190 230 250 250 Q310 240 350 280 Q360 320 300 320 L180 320 Z" fill="#06b6d4" opacity="0.8"/>
  <path d="M190 270 Q240 210 290 230 Q330 260 350 275" stroke="#ec4899" stroke-width="6" fill="none"/>
  <circle cx="280" cy="245" r="8" fill="#ffffff"/>
  <text x="180" y="375" fill="#e2e8f0" font-family="monospace" font-size="14" font-weight="bold">Interactive 3D WebGL Mesh</text>
  <text x="210" y="400" fill="#38bdf8" font-family="sans-serif" font-size="11">60 FPS Smooth Three.js Controls</text>

  <!-- Right Side Product Spec & Quick Buy -->
  <rect x="505" y="125" width="270" height="345" rx="12" fill="#16182e" stroke="#252a48"/>
  <text x="525" y="165" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="bold">CyberKicks v2.0</text>
  <text x="525" y="190" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="900">$189.00 USD</text>
  <text x="525" y="225" fill="#94a3b8" font-family="sans-serif" font-size="11">Next-gen smart sneakers with LED telemetry integration and responsive WebGL showcase.</text>

  <!-- Color pickers -->
  <text x="525" y="270" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="bold">SELECT SHADER THEME:</text>
  <circle cx="535" cy="295" r="12" fill="#06b6d4" stroke="#ffffff" stroke-width="2"/>
  <circle cx="570" cy="295" r="12" fill="#ec4899"/>
  <circle cx="605" cy="295" r="12" fill="#a855f7"/>
  <circle cx="640" cy="295" r="12" fill="#10b981"/>

  <!-- Buy Button -->
  <rect x="525" y="340" width="230" height="44" rx="8" fill="url(#neon-cyan-pink)"/>
  <text x="580" y="367" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">Add To Cart 🛒</text>
  <text x="545" y="420" fill="#22c55e" font-family="sans-serif" font-size="11">✓ Stripe &amp; Apple Pay Ready</text>
  <text x="545" y="440" fill="#94a3b8" font-family="sans-serif" font-size="11">⚡ 100/100 Lighthouse Performance</text>
</svg>